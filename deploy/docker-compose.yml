# JumpServer single-host deployment (self-hosted PostgreSQL + Redis)
#
# Stack: postgresql + redis + core(web) + celery(task) + koko + lion + magnus + chen + web(nginx)
# Config is env-driven: JumpServer core reads env vars (apps/jumpserver/conf.py -> os.environ.get),
# so no config.yml is mounted; everything comes from .env.
#
# Target: stable v4.10.18-ce (CLJUMPSERV-4 decision). core/koko/lion/chen/web all pin
# COMPONENT_TAG=v4.10.18-ce; magnus has no v4 tag so it pins MAGNUS_TAG=v3.10.22 (7-port
# model, matches the pre-single-port v4.10.18 core). CORE_IMAGE defaults to the official
# core image. See deploy/README.md.
#
# Usage:
#   cp deploy/.env.example deploy/.env   &&   edit deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d

x-core-env: &core-env
  env_file: [.env]

networks:
  jms_net:
    name: jms_net

volumes:
  pg_data:
  redis_data:
  core_data:      # shared by core + celery: media, recordings, static, ansible
  koko_data:
  lion_data:
  caddy_data:     # Let's Encrypt certs — back this up (CLJUMPSERV-13)
  caddy_config:

services:
  # ---------- data stores ----------
  postgresql:
    image: postgres:16-bookworm
    container_name: jms_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    container_name: jms_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - redis_data:/data
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- JumpServer core (this repo's image) ----------
  core:
    image: ${CORE_IMAGE}
    container_name: jms_core
    restart: unless-stopped
    <<: *core-env
    command: ["start", "web"]
    volumes:
      - core_data:/opt/jumpserver/data
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [jms_net]
    healthcheck:
      # official JumpServer images ship a `check` binary (no curl in the image)
      test: ["CMD-SHELL", "check http://localhost:8080/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   # first boot runs DB migrate + downloads GeoIP/applets

  celery:
    image: ${CORE_IMAGE}
    container_name: jms_celery
    restart: unless-stopped
    <<: *core-env
    command: ["start", "task"]
    volumes:
      - core_data:/opt/jumpserver/data
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/jumpserver/utils/check_celery.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------- terminal / proxy components ----------
  # NOTE: pin COMPONENT_TAG in .env to a version that matches core (CLJUMPSERV-4).
  koko:
    image: jumpserver/koko:${COMPONENT_TAG}
    container_name: jms_koko
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - koko_data:/opt/koko/data
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]
    ports:
      - "${SSH_PORT:-2222}:2222"   # SSH entry for asset connections
    healthcheck:
      test: ["CMD-SHELL", "check http://localhost:5000/koko/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  lion:
    image: jumpserver/lion:${COMPONENT_TAG}
    container_name: jms_lion
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - lion_data:/opt/lion/data
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "check http://localhost:8081/lion/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  magnus:
    # magnus has NO v4.10.x tag — it ships on its own v3.10.x line.
    # Pinned to v3.10.22 (per-protocol 7-port model), which pairs with the
    # v4.10.18-ce core (pre single-port change a9689d81e). See deploy/README.md.
    image: jumpserver/magnus:${MAGNUS_TAG}
    container_name: jms_magnus
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]
    ports:
      - "${MAGNUS_MYSQL_PORT:-33061}:33061"
      - "${MAGNUS_MARIADB_PORT:-33062}:33062"
      - "${MAGNUS_REDIS_PORT:-63790}:63790"
      - "${MAGNUS_POSTGRESQL_PORT:-54320}:54320"
      - "${MAGNUS_SQLSERVER_PORT:-14330}:14330"
      - "${MAGNUS_ORACLE_PORT:-15210}:15210"
      - "${MAGNUS_MONGODB_PORT:-27018}:27018"

  chen:
    image: jumpserver/chen:${COMPONENT_TAG}
    container_name: jms_chen
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "check http://localhost:8082/chen/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------- web (nginx: serves lina+luna, reverse-proxies core/koko/lion/chen) ----------
  # Internal only — Caddy terminates TLS and fronts it. Not published to host.
  web:
    image: jumpserver/web:${COMPONENT_TAG}
    container_name: jms_web
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - core_data:/opt/jumpserver/data:ro   # serve media/recordings & static
    depends_on:
      core: {condition: service_healthy}
      koko: {condition: service_started}
      lion: {condition: service_started}
      chen: {condition: service_started}
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "check http://localhost/web/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------- TLS reverse proxy (single entry, auto Let's Encrypt) ----------
  caddy:
    image: caddy:2-alpine
    container_name: jms_caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z   # :Z for SELinux-enforcing hosts (Rocky/RHEL)
      - caddy_data:/data       # persists ACME certs & account — DO NOT delete
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    networks: [jms_net]
    ports:
      - "80:80"        # ACME HTTP-01 challenge + http->https redirect
      - "443:443"      # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
