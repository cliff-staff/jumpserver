# JumpServer single-host deployment (self-hosted PostgreSQL + Redis)
#
# Stack: postgresql + redis + core(web) + celery(task) + koko + lion + magnus + chen + web(nginx)
# Config is env-driven: JumpServer core reads env vars (apps/jumpserver/conf.py -> os.environ.get),
# so no config.yml is mounted; everything comes from .env.
#
# Component images (koko/lion/magnus/chen/web) MUST match the core version — see deploy/README.md
# and Plane CLJUMPSERV-4. Set the tags via COMPONENT_TAG / CORE_IMAGE in .env.
#
# Usage:
#   cp deploy/.env.example deploy/.env   &&   edit deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d

x-core-env: &core-env
  env_file: [.env]

networks:
  jms_net:
    name: jms_net

volumes:
  pg_data:
  redis_data:
  core_data:      # shared by core + celery: media, recordings, static, ansible
  koko_data:
  lion_data:

services:
  # ---------- data stores ----------
  postgresql:
    image: postgres:16-bookworm
    container_name: jms_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-bookworm
    container_name: jms_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - redis_data:/data
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- JumpServer core (this repo's image) ----------
  core:
    image: ${CORE_IMAGE}
    container_name: jms_core
    restart: unless-stopped
    <<: *core-env
    command: ["start", "web"]
    volumes:
      - core_data:/opt/jumpserver/data
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [jms_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # first boot runs DB migrate

  celery:
    image: ${CORE_IMAGE}
    container_name: jms_celery
    restart: unless-stopped
    <<: *core-env
    command: ["start", "task"]
    volumes:
      - core_data:/opt/jumpserver/data
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]

  # ---------- terminal / proxy components ----------
  # NOTE: pin COMPONENT_TAG in .env to a version that matches core (CLJUMPSERV-4).
  koko:
    image: jumpserver/koko:${COMPONENT_TAG}
    container_name: jms_koko
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - koko_data:/opt/koko/data
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]
    ports:
      - "${SSH_PORT:-2222}:2222"   # SSH entry for asset connections

  lion:
    image: jumpserver/lion:${COMPONENT_TAG}
    container_name: jms_lion
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - lion_data:/opt/lion/data
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]

  magnus:
    image: jumpserver/magnus:${COMPONENT_TAG}
    container_name: jms_magnus
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]
    ports:
      # Upstream a9689d81e consolidated all DB protocols onto ONE magnus port (default 5525).
      - "${MAGNUS_PORT:-5525}:5525"

  chen:
    image: jumpserver/chen:${COMPONENT_TAG}
    container_name: jms_chen
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-ERROR}
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      core: {condition: service_healthy}
    networks: [jms_net]

  # ---------- web entry (nginx: serves lina+luna, reverse-proxies core/koko/lion/chen) ----------
  web:
    image: jumpserver/web:${COMPONENT_TAG}
    container_name: jms_web
    restart: unless-stopped
    environment:
      CORE_HOST: http://core:8080
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - core_data:/opt/jumpserver/data:ro   # serve media/recordings & static
    depends_on:
      core: {condition: service_healthy}
      koko: {condition: service_started}
      lion: {condition: service_started}
      chen: {condition: service_started}
    networks: [jms_net]
    ports:
      - "${HTTP_PORT:-80}:80"   # put a TLS reverse proxy in front (CLJUMPSERV-11)
